<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>MatchDJ</title>
  <style>
    body { margin: 0; background: #0f172a; color: #f8fafc; font-family: -apple-system, sans-serif; padding: 16px; padding-bottom: 40px; }
    .card { background: #1e293b; padding: 16px; border-radius: 16px; margin-bottom: 14px; }
    .btn { border: none; border-radius: 12px; padding: 12px 16px; font-weight: 700; font-size: 15px; color: white; cursor: pointer; }
    .btn-green { background: #22c55e; color: #052e16; }
    .btn-blue { background: #3b82f6; }
    .btn-sm { padding: 8px 12px; font-size: 13px; border-radius: 8px; }
    input, select { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 15px; margin-bottom: 10px; }
    .tabs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 4px; }
    .tab { background: #1e293b; color: #94a3b8; border: none; padding: 8px 14px; border-radius: 20px; font-weight: 600; white-space: nowrap; }
    .tab.active { background: #3b82f6; color: white; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .pad { border: none; border-radius: 14px; padding: 16px 12px; color: white; text-align: left; font-weight: 700; font-size: 15px; min-height: 85px; display: flex; flex-direction: column; justify-content: space-between; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.25); }
    .pad:active { transform: scale(0.96); }
    .pad small { font-weight: 400; opacity: 0.85; font-size: 12px; margin-top: 6px; }
    .del { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.45); border: none; color: white; border-radius: 50%; width: 24px; height: 24px; display: none; }
    body.edit .del { display: block; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
    <h2 style="margin:0">MatchDJ</h2>
    <div>
      <button class="btn btn-blue btn-sm" onclick="toggleAdd()">+ Ny knapp</button>
      <button class="btn btn-sm" style="background:#334155" onclick="document.body.classList.toggle('edit')">Ändra</button>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
  <div id="add-box" class="card hidden" style="margin-top:16px; border:1px solid #3b82f6;">
    <h3 style="margin-top:0">Lägg till låtknapp</h3>
    <input type="text" id="p-name" placeholder="Namn (t.ex. Mål! - Bro Hymn)" />
    <input type="text" id="p-url" placeholder="Klistra in Spotify-länk..." />
    <select id="p-cat">
      <option value="Mål">Mål</option>
      <option value="Avblåsning">Avblåsning</option>
      <option value="Utvisning">Utvisning</option>
      <option value="Paus">Paus / Uppvärmning</option>
    </select>
    <select id="p-col">
      <option value="#16a34a">Grön (Mål)</option>
      <option value="#2563eb">Blå (Avblåsning)</option>
      <option value="#dc2626">Röd (Utvisning)</option>
      <option value="#d97706">Orange (Hype)</option>
      <option value="#7c3aed">Lila (Paus)</option>
    </select>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-green" style="flex:1" onclick="addPad()">Spara knapp</button>
      <button class="btn" style="background:#475569" onclick="toggleAdd()">Avbryt</button>
    </div>
  </div>

  <div style="margin-top:28px; text-align:center;">
    <button class="btn btn-sm" style="background:#334155" onclick="backup()">Kopiera backup</button>
    <button class="btn btn-sm" style="background:#334155" onclick="restore()">Återställ backup</button>
  </div>

  <script>
    let filter = 'Alla';
    const defaults = new Array(
      { id: 1, t: 'Mål! - Chelsea Dagger', u: 'https://spotify.com', c: 'Mål', bg: '#16a34a' },
      { id: 2, t: 'Mål! - Bro Hymn', u: 'https://spotify.com', c: 'Mål', bg: '#16a34a' },
      { id: 3, t: 'Avblåsning - Seven Nation', u: 'https://spotify.com', c: 'Avblåsning', bg: '#2563eb' },
      { id: 4, t: 'Utvisning - Bad Boys', u: 'https://spotify.com', c: 'Utvisning', bg: '#dc2626' }
    );
    let pads = JSON.parse(localStorage.getItem('mdj_direct')) || defaults;

    function play(id) {
      const p = pads.find(x => x.id === id);
      if (p) window.location.href = p.u;
    }

    function toggleAdd() { document.getElementById('add-box').classList.toggle('hidden'); }

    function addPad() {
      const t = document.getElementById('p-name').value.trim();
      const url = document.getElementById('p-url').value.trim();
      const m = url.match(/track\/([a-zA-Z0-9]+)/);
      const u = m ? 'https://spotify.com' + m.at(1) : (url.startsWith('http') ? url : '');
      if (!t || !u) return alert('Fyll i både namn och en giltig Spotify-länk!');
      pads.push({ id: Date.now(), t, u, c: document.getElementById('p-cat').value, bg: document.getElementById('p-col').value });
      save(); toggleAdd();
      document.getElementById('p-name').value = ''; document.getElementById('p-url').value = '';
    }

    function delPad(e, id) {
      e.stopPropagation();
      if (confirm('Ta bort denna knapp?')) { pads = pads.filter(x => x.id !== id); save(); }
    }

    function save() { localStorage.setItem('mdj_direct', JSON.stringify(pads)); render(); }

    function render() {
      const cats = 'Alla,Mål,Avblåsning,Utvisning,Paus'.split(',');
      document.getElementById('tabs').innerHTML = cats.map(c =>
        `<button class="tab ${filter===c?'active':''}" onclick="filter='${c}';render()">${c}</button>`).join('');
      const list = filter === 'Alla' ? pads : pads.filter(x => x.c === filter);
      document.getElementById('grid').innerHTML = list.map(p =>
        `<button class="pad" style="background:${p.bg}" onclick="play(${p.id})">
          <span class="del" onclick="delPad(event,${p.id})">✕</span>
          <span>${p.t}</span><small>${p.c}</small></button>`).join('');
    }

    function backup() { navigator.clipboard.writeText(JSON.stringify(pads)); alert('Backup kopierad!'); }
    function restore() { try { const d = JSON.parse(prompt('Klistra in backup:')); if (Array.isArray(d)) { pads = d; save(); } } catch(e) { alert('Ogiltig text'); } }

    render();
  </script>
</body>
</html>
